{% extends "base.html" %}
{% block content %}
<div class="auth-page"><div class="auth-card auth-card--wide">
<h1 class="auth-title">{{ t('farm.new_farm') }}</h1>
<form method="POST" class="auth-form">
<div class="form-group"><label class="form-label">{{ t('farm.farm_name') }} *</label><input type="text" name="name" class="form-input" required autofocus/></div>
<div class="form-row"><div class="form-group"><label class="form-label">{{ t('auth.province') }}</label><select name="province" class="form-input form-select"><option value="">...</option>{% for p in provinces %}<option value="{{ p }}">{{ p }}</option>{% endfor %}</select></div>
<div class="form-group"><label class="form-label">{{ t('auth.commune') }}</label><input type="text" name="commune" class="form-input"/></div></div>
<div class="form-group"><label class="form-label">{{ t('map.notes') }}</label><textarea name="description" class="form-input" rows="3"></textarea></div>
<button type="submit" class="btn btn--primary">{{ t('farm.new_farm') }}</button>
</form></div></div>
{% endblock %}
