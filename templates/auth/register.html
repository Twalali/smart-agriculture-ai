{% extends "base.html" %}
{% block title %}{{ t('auth.register_title') }}{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card auth-card--wide">
    <div class="auth-card-header"><div class="auth-logo"><span class="logo-mark">SA</span></div><h1 class="auth-title">{{ t('auth.register_title') }}</h1><p class="auth-subtitle">{{ t('auth.register_sub') }}</p></div>
    <form method="POST" class="auth-form">
        <div class="form-row">
            <div class="form-group"><label class="form-label">{{ t('auth.username') }} <span class="form-required">*</span></label><input type="text" name="username" class="form-input" required/></div>
            <div class="form-group"><label class="form-label">{{ t('auth.email') }} <span class="form-required">*</span></label><input type="email" name="email" class="form-input" required/></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">{{ t('auth.password') }} <span class="form-required">*</span></label><input type="password" name="password" class="form-input" required/></div>
            <div class="form-group"><label class="form-label">{{ t('auth.confirm_password') }} <span class="form-required">*</span></label><input type="password" name="confirm_password" class="form-input" required/></div>
        </div>
        <div class="form-divider">{{ t('auth.profile_optional') }}</div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">{{ t('auth.full_name') }}</label><input type="text" name="full_name" class="form-input"/></div>
            <div class="form-group"><label class="form-label">{{ t('auth.phone') }}</label><input type="tel" name="phone" class="form-input"/></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">{{ t('auth.province') }}</label><select name="province" class="form-input form-select"><option value="">{{ t('auth.select_province') }}</option>{% for p in provinces %}<option value="{{ p }}">{{ p }}</option>{% endfor %}</select></div>
            <div class="form-group"><label class="form-label">{{ t('auth.commune') }}</label><input type="text" name="commune" class="form-input"/></div>
        </div>
        <button type="submit" class="btn btn--primary btn--full">{{ t('auth.create_account') }}</button>
    </form>
    <p class="auth-footer-text">{{ t('auth.already_registered') }} <a href="{{ url_for('auth_login') }}">{{ t('nav.login') }}</a></p>
</div></div>
{% endblock %}
