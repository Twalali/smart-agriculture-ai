{% extends "base.html" %}
{% block title %}{{ t('auth.login_title') }}{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card">
    <div class="auth-card-header"><div class="auth-logo"><span class="logo-mark">SA</span></div><h1 class="auth-title">{{ t('auth.login_title') }}</h1><p class="auth-subtitle">{{ t('auth.login_sub') }}</p></div>
    <form method="POST" class="auth-form">
        <div class="form-group"><label class="form-label">{{ t('auth.username') }}</label><input type="text" name="username" class="form-input" required autofocus/></div>
        <div class="form-group"><label class="form-label">{{ t('auth.password') }}</label><input type="password" name="password" class="form-input" required/></div>
        <div class="form-check"><input type="checkbox" name="remember" id="remember"/><label for="remember">{{ t('auth.remember') }}</label></div>
        <button type="submit" class="btn btn--primary btn--full">{{ t('auth.login_btn') }}</button>
    </form>
    <p class="auth-footer-text">{{ t('auth.no_account') }} <a href="{{ url_for('auth_register') }}">{{ t('auth.register_free') }}</a></p>
</div></div>
{% endblock %}
