{% extends "base.html" %}
{% block title %}Log In — Smart Agriculture AI{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-card-header">
            <div class="auth-logo"><span class="logo-mark">SA</span></div>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Log in to your Smart Agriculture account</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" placeholder="Enter your username" required autofocus />
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="Enter your password" required />
            </div>
            <div class="form-check">
                <input type="checkbox" name="remember" id="remember" />
                <label for="remember">Keep me logged in</label>
            </div>
            <button type="submit" class="btn btn--primary btn--full">Log In</button>
        </form>
        <p class="auth-footer-text">
            Don't have an account? <a href="{{ url_for('auth_register') }}">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
